# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: license-hub

builds:
  - id: license
    main: ./cmd/license
    binary: license
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}

archives:
  - id: default
    ids:
      - license
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - LICENSES/**
      - POLICY.md
      - docs/**

nfpms:
  - id: linux-packages
    ids:
      - license
    package_name: license-hub
    description: Canonical license template hub render and verify CLI.
    maintainer: t33n-software
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    ids:
      - default

signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

release:
  github:
    owner: t33n-software
    name: license-hub
  prerelease: auto

changelog:
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"

name: Publish Template Release
run-name: Template release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "0bsd/v*"
      - "afl-3.0/v*"
      - "agpl-3.0/v*"
      - "all-rights-reserved/v*"
      - "apache-2.0/v*"
      - "apsl-2.0/v*"
      - "artistic-2.0/v*"
      - "aswf-digital-assets-1.0/v*"
      - "aswf-digital-assets-1.1/v*"
      - "blessing/v*"
      - "blueoak-1.0.0/v*"
      - "bsd-1-clause/v*"
      - "bsd-2-clause/v*"
      - "bsd-2-clause-patent/v*"
      - "bsd-3-clause/v*"
      - "bsd-3-clause-clear/v*"
      - "bsl-1.0/v*"
      - "cal-1.0/v*"
      - "cc0-1.0/v*"
      - "cc-by-4.0/v*"
      - "cc-by-nc-4.0/v*"
      - "cc-by-nc-nd-4.0/v*"
      - "cc-by-nc-sa-4.0/v*"
      - "cc-by-nd-4.0/v*"
      - "cc-by-sa-4.0/v*"
      - "cddl-1.0/v*"
      - "cddl-1.1/v*"
      - "cdla-permissive-1.0/v*"
      - "cdla-permissive-2.0/v*"
      - "cdla-sharing-1.0/v*"
      - "cecill-2.1/v*"
      - "cern-ohl-p-2.0/v*"
      - "cern-ohl-s-2.0/v*"
      - "cern-ohl-w-2.0/v*"
      - "community-spec-1.0/v*"
      - "cpal-1.0/v*"
      - "c-uda-1.0/v*"
      - "dl-de-by-2.0/v*"
      - "dl-de-zero-2.0/v*"
      - "ecl-2.0/v*"
      - "elastic-2.0/v*"
      - "epl-2.0/v*"
      - "erlpl-1.1/v*"
      - "esa-pl-permissive-2.4/v*"
      - "esa-pl-strong-copyleft-2.4/v*"
      - "esa-pl-weak-copyleft-2.4/v*"
      - "etalab-2.0/v*"
      - "eupl-1.2/v*"
      - "fair/v*"
      - "freebsd-doc/v*"
      - "fsfap/v*"
      - "fsl-1.1-alv2/v*"
      - "fsl-1.1-mit/v*"
      - "gfdl-1.3/v*"
      - "gpl-2.0/v*"
      - "gpl-3.0/v*"
      - "hippocratic-2.1/v*"
      - "ipa/v*"
      - "isc/v*"
      - "json/v*"
      - "lal-1.3/v*"
      - "lgpl-2.1/v*"
      - "lgpl-3.0/v*"
      - "liliq-p-1.1/v*"
      - "liliq-r-1.1/v*"
      - "liliq-rplus-1.1/v*"
      - "miros/v*"
      - "mit/v*"
      - "mit-0/v*"
      - "mit-modern-variant/v*"
      - "mpl-2.0/v*"
      - "ms-pl/v*"
      - "ms-rl/v*"
      - "mulanpsl-2.0/v*"
      - "norepublish/v*"
      - "odbl-1.0/v*"
      - "odc-by-1.0/v*"
      - "ofl-1.1/v*"
      - "osl-3.0/v*"
      - "pddl-1.0/v*"
      - "polyform-free-trial-1.0.0/v*"
      - "polyform-internal-use-1.0.0/v*"
      - "polyform-noncommercial-1.0.0/v*"
      - "polyform-perimeter-1.0.1/v*"
      - "polyform-shield-1.0.0/v*"
      - "polyform-small-business-1.0.0/v*"
      - "polyform-strict-1.0.0/v*"
      - "shl-2.0/v*"
      - "shl-2.1/v*"
      - "sspl-1.0/v*"
      - "tapr-ohl-1.0/v*"
      - "unlicense/v*"
      - "wtfpl/v*"
      - "zlib/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable <family>/v<semver> template tag to release"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: template-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  template-release:
    if: github.repository == 't33n-software/license-hub'
    runs-on: ubuntu-24.04
    environment: release-delivery
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate template release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if ! [[ "${tag}" =~ ^[a-z0-9-]+/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag ${tag} is not a valid <family>/v<semver> template release tag."
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          test "${tag_commit}" = "$(git rev-parse HEAD)"

      - name: Package template family with checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          family="${tag%%/*}"
          mapfile -t templates < <(find templates -type f -name "*.hbs" -path "*/${family}/*" | sort)
          test "${#templates[@]}" -gt 0
          out=".build/template-release"
          mkdir -p "${out}"
          cp "${templates[@]}" "${out}/"
          changelog="$(find templates -type f -name "CHANGELOG.md" -path "*/${family}/*" -print -quit)"
          test -n "${changelog}"
          cp "${changelog}" "${out}/CHANGELOG.md"
          ( cd "${out}" && sha256sum -- *.hbs > SHA256SUMS )
          cat "${out}/SHA256SUMS"

      - name: Create draft release with complete evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          family="${tag%%/*}"
          gh release create "${tag}" \
            --draft \
            --verify-tag \
            --title "${family} ${tag#*/}" \
            --notes "Immutable template release ${tag}. Verify template digests against SHA256SUMS before pinning them in tenant license.lock.json files." \
            .build/template-release/*.hbs \
            .build/template-release/CHANGELOG.md \
            .build/template-release/SHA256SUMS

      - name: Verify draft artifact set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release view "${tag}" --json assets --jq '.assets[].name'
          ( cd .build/template-release && sha256sum --check SHA256SUMS )

      - name: Attest template artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ".build/template-release/**"

      - name: Publish release exactly once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release edit "${tag}" --draft=false

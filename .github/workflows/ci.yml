name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOVCS: "*:off"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (linux-amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: true
          cache-dependency-path: |
            tools/go.sum

      - name: Verify controlled Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"

      - name: Run full build gate
        run: go run -mod=readonly ./cmd/build

      - name: Report coverage breakdown on failure
        if: failure()
        shell: bash
        run: |
          go test -count=1 -coverprofile=coverage.out ./... || true
          test ! -f coverage.out || go tool cover -func=coverage.out

  native-smoke:
    name: Native smoke test (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            goarch: amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          check-latest: false
          cache: true
          cache-dependency-path: |
            tools/go.sum

      - name: Verify controlled Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"

      - name: Build and smoke test native binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/bin
          go build -mod=readonly -trimpath -o ".build/bin/license" ./cmd/license
          "./.build/bin/license" version
          "./.build/bin/license" digest --template templates/custom/norepublish/NoRepublish-1.0.0.hbs
          "./.build/bin/license" verify \
            --template templates/custom/norepublish/NoRepublish-1.0.0.hbs \
            --org-defaults org-defaults.json \
            --values license.values.json \
            --lock license.lock.json \
            --dir .

  release-config:
    name: Release configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.16.0
          args: check
